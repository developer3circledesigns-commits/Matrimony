services:
  app:
    build: .
    ports:
      - "8091:80"
    volumes:
      - .:/var/www/html
      - storage_data:/var/www/html/storage
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: ${APP_DEBUG:-false}
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-u814177917_matrimony}
      DB_USERNAME: ${DB_USERNAME:-u814177917_matrimony}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - matrimony-net
    restart: unless-stopped

  db:
    image: mysql:8.0
    ports: []
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD is required}
      MYSQL_DATABASE: ${DB_DATABASE:-u814177917_matrimony}
      MYSQL_USER: ${DB_USERNAME:-u814177917_matrimony}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./app/database/matrimony_complete.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 10s
      retries: 10
    networks:
      - matrimony-net
    restart: unless-stopped

  # Local/dev only: docker compose --profile tools up -d
  phpmyadmin:
    profiles: ["tools"]
    image: phpmyadmin:latest
    ports:
      - "127.0.0.1:8083:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      UPLOAD_LIMIT: 100M
      MAX_EXECUTION_TIME: 600
      MEMORY_LIMIT: 512M
    depends_on:
      db:
        condition: service_healthy
    networks:
      - matrimony-net
    restart: unless-stopped

networks:
  matrimony-net:
    driver: bridge

volumes:
  mysql_data:
  storage_data:
